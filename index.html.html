<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confronta Casa V2.2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#1f2937}.wrap{max-width:1100px;margin:auto;padding:28px 16px 50px}h1{text-align:center;margin:0;font-size:34px}header p{text-align:center;color:#6b7280;margin:8px 0 28px}.houses{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.house{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 20px #0000000d;border:1px solid #e5e7eb}.house h2{margin:0 0 18px}.field{margin-bottom:14px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;background:white}.weights{margin-top:22px;background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 20px #0000000d;border:1px solid #e5e7eb}.weights h2{margin-top:0}.hint{color:#6b7280;font-size:14px}.weight-row{display:grid;grid-template-columns:170px 1fr 48px;gap:12px;align-items:center;margin:13px 0}.weight-row input{width:100%}.weight-value{text-align:right;font-weight:700}.total{text-align:right;font-weight:700;margin-top:10px}.actions{text-align:center;margin:24px 0}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer;margin:5px}.primary{background:#111827;color:#fff}.secondary{background:#fff;border:1px solid #d1d5db}.results{display:none;background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 20px #0000000d;border:1px solid #e5e7eb}.winner{text-align:center;padding:18px;background:#f8fafc;border-radius:14px;margin-bottom:18px}.winner .score{font-size:30px;font-weight:800;margin:8px}.rank{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #eee}.rank:last-child{border-bottom:0}.bar{height:8px;background:#e5e7eb;border-radius:20px;overflow:hidden;flex:1;margin:0 10px}.bar span{display:block;height:100%;background:#111827}.error{color:#b91c1c;text-align:center;font-weight:700;margin-top:10px}.remove{float:right;border:0;background:none;color:#9ca3af;font-size:18px;cursor:pointer}.small{font-size:12px;color:#6b7280}.hidden{display:none}@media(max-width:700px){.houses{grid-template-columns:1fr}.weight-row{grid-template-columns:130px 1fr 45px}h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🏠 Confronta Casa</h1><p>Confronta le abitazioni e scopri quale fa più al caso tuo.</p></header>
<div id="houses" class="houses"></div>
<div class="actions"><button class="btn secondary" id="addBtn">＋ Aggiungi Casa 3</button></div>
<section class="weights">
<h2>⚖️ Cosa conta di più per te?</h2><p class="hint">Sposta i cursori come preferisci. Le percentuali non cambiano da sole: in fase di confronto verranno normalizzate internamente.</p>
<div id="weightRows"></div><div class="total">Totale: <span id="totalWeight">100%</span></div>
</section>
<div class="actions"><button class="btn primary" id="compareBtn">Confronta →</button><div id="error" class="error"></div></div>
<section id="results" class="results"><h2>🏆 Risultato</h2><div id="winner" class="winner"></div><div id="ranking"></div></section>
</div>
<script>
const criteria=[
 ['rent','💰 Affitto / Mutuo','€ al mese','number',true],
 ['size','📐 Grandezza','m²','number',false],
 ['rooms','🛏️ Stanze','numero','number',false],
 ['distance','🚗 Distanza','km','number',true],
 ['bills','💡 Bollette stimate','€ al mese','number',true],
 ['energy','⚡ Classe energetica','','select',false],
 ['parking','🅿️ Parcheggio','','select',false]
];
let houseCount=2;
let weights={rent:30,size:15,rooms:10,distance:20,bills:10,energy:5,parking:10};
const energy=['A4','A3','A2','A1','B','C','D','E','F','G'];
const parking=['Garage','Posto auto privato','Parcheggio esterno disponibile','Nessun parcheggio'];
function houseHTML(i){return `<article class="house"><button class="remove ${i===1||i===2?'hidden':''}" onclick="removeHouse(${i})">✕</button><h2>🏠 Casa ${i}</h2>${criteria.map(c=>{let [id,label,unit,type]=c;if(type==='select'){let opts=id==='energy'?energy:parking;return `<div class="field"><label>${label}</label><select id="h${i}-${id}"><option value="">Seleziona</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`}return `<div class="field"><label>${label}</label><input id="h${i}-${id}" type="number" min="0" step="any" placeholder="Inserisci ${unit}"><div class="small">${unit}</div></div>`}).join('')}</article>`}
function saveHouseValues(){
 const saved={};
 for(let i=1;i<=houseCount;i++){
   saved[i]={};
   criteria.forEach(([id])=>{saved[i][id]=getValue(i,id);});
 }
 return saved;
}
function restoreHouseValues(saved){
 Object.entries(saved).forEach(([i,data])=>{
   Object.entries(data).forEach(([id,value])=>{
     const el=document.getElementById(`h${i}-${id}`);
     if(el) el.value=value;
   });
 });
}
function renderHouses(savedValues=null){
 const saved=savedValues || saveHouseValues();
 document.getElementById('houses').innerHTML=Array.from({length:houseCount},(_,j)=>houseHTML(j+1)).join('');
 restoreHouseValues(saved);
 document.getElementById('addBtn').style.display=houseCount===3?'none':'inline-block';
 enableFieldNavigation();
}

function enableFieldNavigation(){
 const fields=[...document.querySelectorAll('.house input[type=number], .house select')];
 fields.forEach((field,index)=>{
   field.addEventListener('keydown',e=>{
     if(e.key==='ArrowDown' || e.key==='ArrowUp'){
       e.preventDefault();
       const nextIndex=e.key==='ArrowDown'?index+1:index-1;
       if(fields[nextIndex]){
         fields[nextIndex].focus();
         if(fields[nextIndex].select) fields[nextIndex].select();
       }
     }
   });
 });
}

function renderWeights(){document.getElementById('weightRows').innerHTML=criteria.map(c=>{let [id,label]=c;return `<div class="weight-row"><label for="w-${id}">${label}</label><input id="w-${id}" type="range" min="0" max="100" value="${weights[id]}" data-id="${id}"><span class="weight-value" id="wv-${id}">${weights[id]}%</span></div>`}).join('');document.querySelectorAll('.weight-row input').forEach(x=>x.addEventListener('input',e=>adjustWeight(e.target.dataset.id,+e.target.value)));updateTotal()}
function adjustWeight(changed,value){weights[changed]=value;document.getElementById('wv-'+changed).textContent=value+'%';updateTotal()}
function updateTotal(){let sum=Object.values(weights).reduce((a,b)=>a+b,0);document.getElementById('totalWeight').textContent=Math.round(sum)+'%'}
function getValue(i,id){let el=document.getElementById(`h${i}-${id}`);return el?el.value:''}
function validate(){for(let i=1;i<=houseCount;i++){for(let [id,label,,type] of criteria){if(type==='number'&&!getValue(i,id)){return `Inserisci ${label.toLowerCase()} per Casa ${i}.`}if(type==='select'&&!getValue(i,id)){return `Seleziona ${label.toLowerCase()} per Casa ${i}.`}}}return ''}
function normalize(vals,higher){let nums=vals.map(Number), min=Math.min(...nums),max=Math.max(...nums);if(max===min)return nums.map(()=>100);return nums.map(v=>higher?((v-min)/(max-min))*100:((max-v)/(max-min))*100)}
function compare(){
 let err=validate();
 document.getElementById('error').textContent=err;
 if(err)return;
 let weightSum=Object.values(weights).reduce((a,b)=>a+b,0);
 if(weightSum===0){document.getElementById('error').textContent='Imposta almeno una priorità maggiore di 0%.';return;}
 let scores=Array.from({length:houseCount},()=>0);
 let contributions=Array.from({length:houseCount},()=>[]);
 criteria.forEach(([id,label,unit,type,higher])=>{
   let vals=[];
   for(let i=1;i<=houseCount;i++){
     let v=getValue(i,id);
     if(id==='energy')v=100-energy.indexOf(v)*5;
     if(id==='parking')v=100-parking.indexOf(v)*30;
     vals.push(v);
   }
   let normalized=type==='number'?normalize(vals,higher):vals.map(Number);
   for(let i=0;i<houseCount;i++){
     let contribution=normalized[i]*(weights[id]/100);
     scores[i]+=contribution;
     contributions[i].push({id,label,weight:weights[id],value:normalized[i],contribution});
   }
 });
 scores=scores.map(score=>score*(100/weightSum));
 let ranking=scores.map((score,i)=>({house:i+1,score})).sort((a,b)=>b.score-a.score);
 let win=ranking[0];
 let topReasons=contributions[win.house-1].filter(x=>x.weight>0).sort((a,b)=>b.contribution-a.contribution).slice(0,2);
 let reasonText='';
 if(topReasons.length===1){
   reasonText=`Soprattutto per ${topReasons[0].label.toLowerCase()}, che ha avuto un peso del ${topReasons[0].weight}%.`;
 } else if(topReasons.length>=2){
   reasonText=`Soprattutto per ${topReasons[0].label.toLowerCase()} (${topReasons[0].weight}%) e ${topReasons[1].label.toLowerCase()} (${topReasons[1].weight}%), che hanno contribuito maggiormente al punteggio.`;
 }
 document.getElementById('winner').innerHTML=`<div>La casa migliore secondo le tue priorità è</div><div class="score">🏆 Casa ${win.house}</div><strong>${win.score.toFixed(1)}/100</strong><div class="hint">Il punteggio considera tutti i criteri e i pesi che hai scelto.</div><div style="margin-top:16px;padding:14px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;text-align:left"><strong>💡 Perché questa scelta?</strong><div class="hint" style="margin-top:6px">${reasonText} Casa ${win.house} ha ottenuto il punteggio complessivo più alto in base alle priorità che hai impostato.</div></div>`;
 document.getElementById('ranking').innerHTML=ranking.map((r,i)=>`<div class="rank"><strong>${i===0?'🥇':i===1?'🥈':'🥉'} Casa ${r.house}</strong><div class="bar"><span style="width:${r.score}%"></span></div><strong>${r.score.toFixed(1)}</strong></div>`).join('');
 document.getElementById('results').style.display='block';
 document.getElementById('results').scrollIntoView({behavior:'smooth'});
}
function addHouse(){if(houseCount<3){const saved=saveHouseValues();houseCount=3;renderHouses(saved)}}
function removeHouse(i){if(houseCount===3){const saved=saveHouseValues();delete saved[3];houseCount=2;renderHouses(saved)}}
document.getElementById('addBtn').addEventListener('click',addHouse);document.getElementById('compareBtn').addEventListener('click',compare);renderHouses();renderWeights();
</script>
</body>
</html>
